
## --- ty (Typechecker, CLI & VSCode-Extension) --------------------------------
## Das kombinierte MicroPython-Typeshed (.typeshed/) wird von
## scripts/update-typeshed.sh erzeugt (nach Stub-Updates erneut ausführen).
## Nur src/ (Geräte-Code) wird typgeprüft: test/ und Utilities/ sind
## Host-CPython-Skripte (unittest, argparse, os.path, cv2), die mit dem
## MicroPython-Typeshed kollidieren würden.
[tool.ty.src]
include = ["src"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.11"
typeshed = ".typeshed"
## src ist ein Package (__init__.py), die Treibermodule importieren sich aber
## flach (import hub75) wie auf dem Gerät - daher src zusätzlich als Suchpfad.
extra-paths = ["src"]

[tool.ruff]
line-length = 160
indent-width = 4
target-version = "py310"
exclude = [
    "__init__.py",
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "I", "C90"]
ignore = ["E201", "E202", "E203", "E221", "E222", "E241", "E265", "E266"]

[tool.ruff.lint.mccabe]
max-complexity = 10
